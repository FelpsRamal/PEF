                          </td>
                          <td class="py-3.5 px-4 text-[#52525B]">${Utils.escapeHtml(mov.responsible)}</td>
                          <td class="py-3.5 px-4 text-[#71717A]">${Utils.escapeHtml(mov.date)}</td>
                          <td class="py-3.5 px-5 text-right font-mono text-[11px] text-[#52525B]">${Utils.escapeHtml(mov.reference)}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Subtle Bottom Metadata (Matches prototype bottom line) -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-[#A1A1AA] pt-1">
              <span>Dados operacionais sincronizados • Visão gerencial do estoque</span>
              <span>Última atualização: ${Utils.formatDateTimeNow()}</span>
            </div>
          </div>
        `;
      },

      // 4.1.3 GESTÃO DE PRODUTOS
      ProductsView() {
        const { search, category, status } = Store.state.productFilters;
        const categories = Store.getCategories();

        const filteredProducts = Store.state.products.filter(p => {
          const matchesSearch =
            !search ||
            p.name.toLowerCase().includes(search.toLowerCase()) ||
            p.sku.toLowerCase().includes(search.toLowerCase());
          const matchesCat = category === 'all' || p.category === category;
          const isLow = p.quantity < p.minStock;
          const matchesStatus =
            status === 'all' ||
            (status === 'low' && isLow) ||
            (status === 'normal' && !isLow);
          return matchesSearch && matchesCat && matchesStatus;
        });

        return `
          <div class="space-y-6 fade-in">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-[#18181B]">Produtos</h1>
                <p class="text-[13px] text-[#71717A] mt-0.5">Gerencie o catálogo, preços unitários e níveis mínimos de estoque.</p>
              </div>
              <button
                onclick="Components.openProductModal()"
                class="h-9 px-4 bg-[#18181B] text-white rounded-lg text-xs font-medium hover:bg-[#27272A] transition-colors inline-flex items-center gap-1.5 self-start sm:self-auto"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Novo produto</span>
              </button>
            </div>

            <!-- Filters Bar -->
            <div class="bg-white border border-[#E5E7EB] rounded-xl p-4 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
              <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-3.5 h-3.5 text-[#A1A1AA] absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input
                  type="text"
                  value="${Utils.escapeHtml(search)}"
                  oninput="App.updateProductFilter('search', this.value)"
                  placeholder="Filtrar por nome ou SKU..."
                  class="w-full h-9 pl-8.5 pr-3 text-xs bg-[#FAFAFA] border border-[#E5E7EB] rounded-lg focus:outline-none focus:bg-white focus:border-[#18181B]"
                />
              </div>

              <div class="flex flex-wrap items-center gap-2.5">
                <select
                  onchange="App.updateProductFilter('category', this.value)"
                  class="h-9 px-3 text-xs bg-white border border-[#E5E7EB] rounded-lg text-[#18181B] focus:outline-none focus:border-[#18181B]"
                >
                  <option value="all" ${category === 'all' ? 'selected' : ''}>Todas as categorias</option>
                  ${categories.map(c => `
                    <option value="${Utils.escapeHtml(c)}" ${category === c ? 'selected' : ''}>${Utils.escapeHtml(c)}</option>
                  `).join('')}
                </select>

                <select
                  onchange="App.updateProductFilter('status', this.value)"
                  class="h-9 px-3 text-xs bg-white border border-[#E5E7EB] rounded-lg text-[#18181B] focus:outline-none focus:border-[#18181B]"
                >
                  <option value="all" ${status === 'all' ? 'selected' : ''}>Todos os status</option>
                  <option value="normal" ${status === 'normal' ? 'selected' : ''}>Estoque Normal</option>
                  <option value="low" ${status === 'low' ? 'selected' : ''}>Estoque Baixo</option>
                </select>
              </div>
            </div>

            <!-- Products Table -->
            <div class="bg-white border border-[#E5E7EB] rounded-xl overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-[#FAFAFA] border-b border-[#E5E7EB] text-[11px] font-medium text-[#71717A]">
                      <th class="py-3 px-5">Produto / SKU</th>
                      <th class="py-3 px-4">Categoria</th>
                      <th class="py-3 px-4">Preço Unitário</th>
                      <th class="py-3 px-4">Em Estoque</th>
                      <th class="py-3 px-4">Mínimo</th>
                      <th class="py-3 px-4">Status</th>
                      <th class="py-3 px-5 text-right">Ações</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[#F4F4F5] text-xs">
                    ${filteredProducts.length === 0 ? `
                      <tr>
                        <td colspan="7" class="py-10 text-center text-[#71717A]">
                          Nenhum produto encontrado com os filtros selecionados.
                        </td>
                      </tr>
                    ` : filteredProducts.map(prod => {
                      const isLow = prod.quantity < prod.minStock;
                      return `
                        <tr class="hover:bg-[#FAFAFA] transition-colors">
                          <td class="py-3.5 px-5">
                            <div class="font-medium text-[#18181B]">${Utils.escapeHtml(prod.name)}</div>
                            <div class="text-[11px] font-mono text-[#71717A]">${Utils.escapeHtml(prod.sku)}</div>
                          </td>
                          <td class="py-3.5 px-4 text-[#52525B]">
                            ${Components.renderBadge(prod.category, 'neutral')}
                          </td>
                          <td class="py-3.5 px-4 font-medium text-[#18181B]">
                            ${Utils.formatCurrency(prod.price)}
                          </td>
                          <td class="py-3.5 px-4 font-semibold ${isLow ? 'text-amber-700' : 'text-[#18181B]'}">
                            ${prod.quantity} ${Utils.escapeHtml(prod.unit)}
                          </td>
                          <td class="py-3.5 px-4 text-[#71717A]">
                            ${prod.minStock} ${Utils.escapeHtml(prod.unit)}
                          </td>
                          <td class="py-3.5 px-4">
                            ${isLow
                              ? Components.renderBadge('Estoque baixo', 'warning')
                              : Components.renderBadge('Normal', 'neutral')
                            }
                          </td>
                          <td class="py-3.5 px-5 text-right">
                            <div class="inline-flex items-center justify-end gap-1">
                              <button
                                onclick="Components.openMovementModal('${prod.id}', 'entrada')"
                                title="Registrar movimentação"
                                class="p-1.5 rounded-lg text-[#52525B] hover:bg-[#F4F4F5] hover:text-[#18181B]"
                              >
                                <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                              </button>
                              <button
                                onclick="Components.openProductModal('${prod.id}')"
                                title="Editar produto"
                                class="p-1.5 rounded-lg text-[#52525B] hover:bg-[#F4F4F5] hover:text-[#18181B]"
                              >
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                              </button>
                              <button
                                onclick="Components.openDeleteConfirmModal('${prod.id}')"
                                title="Excluir produto"
                                class="p-1.5 rounded-lg text-[#52525B] hover:bg-red-50 hover:text-red-600"
                              >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                              </button>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      },

      // 4.1.4 MOVIMENTAÇÃO DE ESTOQUE
      MovementsView() {
        const { search, type } = Store.state.movementFilters;

        const filteredMovements = Store.state.movements.filter(m => {
          const matchesSearch =
            !search ||
            m.productName.toLowerCase().includes(search.toLowerCase()) ||
            m.productSku.toLowerCase().includes(search.toLowerCase()) ||
            m.reference.toLowerCase().includes(search.toLowerCase()) ||
            m.responsible.toLowerCase().includes(search.toLowerCase());
          const matchesType = type === 'all' || m.type === type;
          return matchesSearch && matchesType;
        });

        const totalIn = Store.state.movements.filter(m => m.type === 'entrada').reduce((s, m) => s + m.quantity, 0);
        const totalOut = Store.state.movements.filter(m => m.type === 'saida').reduce((s, m) => s + m.quantity, 0);

        return `
          <div class="space-y-6 fade-in">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-[#18181B]">Movimentações</h1>
                <p class="text-[13px] text-[#71717A] mt-0.5">Histórico auditável de entradas e saídas de mercadorias.</p>
              </div>
              <div class="flex items-center gap-2.5">
                <button
                  onclick="Components.openMovementModal('', 'saida')"
                  class="h-9 px-3.5 bg-white border border-[#E5E7EB] text-[#18181B] rounded-lg text-xs font-medium hover:bg-[#F4F4F5] transition-colors inline-flex items-center gap-1.5"
                >
                  <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                  <span>Registrar saída</span>
                </button>
                <button
                  onclick="Components.openMovementModal('', 'entrada')"
                  class="h-9 px-4 bg-[#18181B] text-white rounded-lg text-xs font-medium hover:bg-[#27272A] transition-colors inline-flex items-center gap-1.5"
                >
                  <i data-lucide="arrow-down-left" class="w-3.5 h-3.5"></i>
                  <span>Registrar entrada</span>
                </button>
              </div>
            </div>

            <!-- Summary Mini Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-white border border-[#E5E7EB] rounded-xl p-4 flex items-center justify-between">
                <div>
                  <span class="text-xs text-[#71717A]">Total de registros</span>
                  <div class="text-xl font-bold text-[#18181B] mt-0.5">${Store.state.movements.length}</div>
                </div>
                <div class="w-9 h-9 rounded-lg bg-[#F4F4F5] flex items-center justify-center text-[#18181B]">
                  <i data-lucide="history" class="w-4 h-4"></i>
                </div>
              </div>
              <div class="bg-white border border-[#E5E7EB] rounded-xl p-4 flex items-center justify-between">
                <div>
                  <span class="text-xs text-[#71717A]">Volume de entradas</span>
                  <div class="text-xl font-bold text-[#18181B] mt-0.5">+${Utils.formatNumber(totalIn)} un.</div>
                </div>
                <div class="w-9 h-9 rounded-lg bg-[#F4F4F5] flex items-center justify-center text-[#18181B]">
                  <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
                </div>
              </div>
              <div class="bg-white border border-[#E5E7EB] rounded-xl p-4 flex items-center justify-between">
                <div>
                  <span class="text-xs text-[#71717A]">Volume de saídas</span>
                  <div class="text-xl font-bold text-[#18181B] mt-0.5">−${Utils.formatNumber(totalOut)} un.</div>
                </div>
                <div class="w-9 h-9 rounded-lg bg-[#F4F4F5] flex items-center justify-center text-[#18181B]">
                  <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                </div>
              </div>
            </div>

            <!-- Filters -->
            <div class="bg-white border border-[#E5E7EB] rounded-xl p-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-3.5 h-3.5 text-[#A1A1AA] absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input
                  type="text"
                  value="${Utils.escapeHtml(search)}"
                  oninput="App.updateMovementFilter('search', this.value)"
                  placeholder="Buscar por produto, SKU, referência ou responsável..."
                  class="w-full h-9 pl-8.5 pr-3 text-xs bg-[#FAFAFA] border border-[#E5E7EB] rounded-lg focus:outline-none focus:bg-white focus:border-[#18181B]"
                />
              </div>

              <div class="flex items-center gap-1.5 bg-[#FAFAFA] p-1 rounded-lg border border-[#E5E7EB]">
                ${[
                  { id: 'all', label: 'Todas' },
                  { id: 'entrada', label: 'Entradas' },
                  { id: 'saida', label: 'Saídas' }
                ].map(tab => `
                  <button
                    onclick="App.updateMovementFilter('type', '${tab.id}')"
                    class="px-3 py-1.5 rounded-md text-xs font-medium transition-colors ${
                      type === tab.id ? 'bg-[#18181B] text-white' : 'text-[#52525B] hover:text-[#18181B]'
                    }"
                  >
                    ${tab.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Movements Table -->
            <div class="bg-white border border-[#E5E7EB] rounded-xl overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-[#FAFAFA] border-b border-[#E5E7EB] text-[11px] font-medium text-[#71717A]">
                      <th class="py-3 px-5">Produto</th>
                      <th class="py-3 px-4">Tipo</th>
                      <th class="py-3 px-4">Quantidade</th>
                      <th class="py-3 px-4">Responsável</th>
                      <th class="py-3 px-4">Data e hora</th>
                      <th class="py-3 px-4">Observação</th>
                      <th class="py-3 px-5 text-right">Referência</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[#F4F4F5] text-xs">
                    ${filteredMovements.length === 0 ? `
                      <tr>
                        <td colspan="7" class="py-10 text-center text-[#71717A]">Nenhuma movimentação encontrada.</td>
                      </tr>
                    ` : filteredMovements.map(mov => {
                      const isEntrada = mov.type === 'entrada';
                      return `
                        <tr class="hover:bg-[#FAFAFA] transition-colors">
                          <td class="py-3.5 px-5">
                            <div class="font-medium text-[#18181B]">${Utils.escapeHtml(mov.productName)}</div>
                            <div class="text-[11px] font-mono text-[#71717A]">${Utils.escapeHtml(mov.productSku)}</div>
                          </td>
                          <td class="py-3.5 px-4">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-medium border ${
                              isEntrada
                                ? 'bg-[#F4F4F5] text-[#18181B] border-[#E4E4E7]'
                                : 'bg-white text-[#52525B] border-[#E5E7EB]'
                            }">
                              <i data-lucide="${isEntrada ? 'arrow-down' : 'arrow-up'}" class="w-3 h-3"></i>
                              ${isEntrada ? 'Entrada' : 'Saída'}
                            </span>
                          </td>
                          <td class="py-3.5 px-4 font-semibold text-[#18181B]">
                            ${isEntrada ? '+' : '−'}${mov.quantity} ${Utils.escapeHtml(mov.unit)}
                          </td>
                          <td class="py-3.5 px-4 text-[#52525B]">${Utils.escapeHtml(mov.responsible)}</td>
                          <td class="py-3.5 px-4 text-[#71717A]">${Utils.escapeHtml(mov.date)}</td>
                          <td class="py-3.5 px-4 text-[#71717A] max-w-[200px] truncate">${Utils.escapeHtml(mov.notes || '—')}</td>
                          <td class="py-3.5 px-5 text-right font-mono text-[11px] text-[#52525B]">${Utils.escapeHtml(mov.reference)}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      },

      // ALERTAS DE ESTOQUE
      AlertsView() {
        const lowItems = Store.getLowStockProducts();

        return `
          <div class="space-y-6 fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-[#18181B]">Alertas de estoque</h1>
                <p class="text-[13px] text-[#71717A] mt-0.5">Itens operando abaixo do estoque mínimo que requerem reposição prioritária.</p>
              </div>
              <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white border border-[#E5E7EB] text-xs font-medium text-[#18181B]">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i>
                <span>${lowItems.length} ${lowItems.length === 1 ? 'item crítico' : 'itens críticos'}</span>
              </div>
            </div>

            ${lowItems.length === 0 ? `
              <div class="bg-white border border-[#E5E7EB] rounded-xl p-12 text-center">
                <div class="w-12 h-12 rounded-2xl bg-[#F4F4F5] text-[#18181B] flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                </div>
                <h3 class="text-sm font-semibold text-[#18181B]">Nenhum alerta pendente</h3>
                <p class="text-xs text-[#71717A] mt-1">Todos os produtos cadastrados estão acima do nível mínimo configurado.</p>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${lowItems.map(item => {
                  const deficit = Math.max(0, item.minStock - item.quantity);
                  const suggestedOrder = Math.max(10, (item.minStock * 2) - item.quantity);
                  const percent = Math.min(100, Math.round((item.quantity / item.minStock) * 100));

                  return `
                    <div class="bg-white border border-[#E5E7EB] rounded-xl p-5 flex flex-col justify-between gap-4">
                      <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                          <span class="font-mono text-[11px] font-medium px-2 py-0.5 rounded bg-[#F4F4F5] text-[#52525B]">
                            ${Utils.escapeHtml(item.sku)}
                          </span>
                          ${Components.renderBadge(`Déficit: ${deficit} ${item.unit}`, 'warning')}
                        </div>
                        <h3 class="text-sm font-semibold text-[#18181B]">${Utils.escapeHtml(item.name)}</h3>
                        <p class="text-xs text-[#71717A] mt-0.5">${Utils.escapeHtml(item.category)}</p>

                        <!-- Progress Bar -->
                        <div class="mt-4">
                          <div class="flex items-center justify-between text-xs mb-1.5">
                            <span class="font-semibold text-[#18181B]">Atual: ${item.quantity} ${item.unit}</span>
                            <span class="text-[#71717A]">Mínimo: ${item.minStock} ${item.unit}</span>
                          </div>
                          <div class="w-full h-2 bg-[#F4F4F5] rounded-full overflow-hidden">
                            <div class="h-full bg-[#18181B] rounded-full" style="width: ${percent}%"></div>
                          </div>
                        </div>
                      </div>

                      <div class="pt-3 border-t border-[#F4F4F5] flex items-center justify-between gap-2">
                        <span class="text-[11px] text-[#71717A]">Sugestão: +${suggestedOrder} ${item.unit}</span>
                        <button
                          onclick="Components.openMovementModal('${item.id}', 'entrada', ${suggestedOrder})"
                          class="px-3 py-1.5 bg-[#18181B] text-white text-xs font-medium rounded-lg hover:bg-[#27272A] transition-colors inline-flex items-center gap-1.5"
                        >
                          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                          <span>Repor estoque</span>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      },

      // 4.1.5 RELATÓRIOS
      ReportsView() {
        const tab = Store.state.reportTab;
        const products = Store.state.products;
        const lowProducts = Store.getLowStockProducts();
        const movements = Store.state.movements;

        const totalStockValue = Store.getTotalStockValue();
        const totalInQty = movements.filter(m => m.type === 'entrada').reduce((a, b) => a + b.quantity, 0);
        const totalOutQty = movements.filter(m => m.type === 'saida').reduce((a, b) => a + b.quantity, 0);

        return `
          <div class="space-y-6 fade-in">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-[#18181B]">Relatórios</h1>
                <p class="text-[13px] text-[#71717A] mt-0.5">Consolidação analítica do inventário, itens críticos e fluxo operacional.</p>
              </div>
              <div class="flex items-center gap-2.5 no-print">
                <button
                  onclick="window.print()"
                  class="h-9 px-3.5 bg-white border border-[#E5E7EB] text-[#18181B] rounded-lg text-xs font-medium hover:bg-[#F4F4F5] transition-colors inline-flex items-center gap-1.5"
                >
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                  <span>Imprimir</span>
                </button>
                <button
                  onclick="App.exportCurrentReportCSV()"
                  class="h-9 px-4 bg-[#18181B] text-white rounded-lg text-xs font-medium hover:bg-[#27272A] transition-colors inline-flex items-center gap-1.5"
                >
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  <span>Exportar CSV</span>
                </button>
              </div>
            </div>

            <!-- Summary KPIs -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${Components.renderKpiCard({
                title: 'Patrimônio em estoque',
                value: Utils.formatCurrency(totalStockValue),
                icon: 'wallet',
                subLeft: `${products.length} SKUs ativos`,
                subRight: 'Valorizado a custo unitário'
              })}
              ${Components.renderKpiCard({
                title: 'Entradas acumuladas',
                value: `+${Utils.formatNumber(totalInQty)} un.`,
                icon: 'arrow-down-left',
                subLeft: `${movements.filter(m => m.type === 'entrada').length} operações`,
                subRight: 'Recebimentos'
              })}
              ${Components.renderKpiCard({
                title: 'Saídas acumuladas',
                value: `−${Utils.formatNumber(totalOutQty)} un.`,
                icon: 'arrow-up-right',
                subLeft: `${movements.filter(m => m.type === 'saida').length} operações`,
                subRight: 'Requisições'
              })}
              ${Components.renderKpiCard({
                title: 'Itens para reposição',
                value: String(lowProducts.length),
                icon: 'alert-circle',
                subLeft: lowProducts.length > 0 ? 'Ação recomendada' : 'Sem pendências',
                subRight: 'Abaixo do mínimo'
              })}
            </div>

            <!-- Report Section Tabs -->
            <div class="bg-white border border-[#E5E7EB] rounded-xl overflow-hidden">
              <div class="px-5 pt-4 border-b border-[#E5E7EB] flex flex-wrap items-center justify-between gap-4 no-print">
                <div class="flex items-center gap-6">
                  ${[
                    { id: 'all', label: `Produtos cadastrados (${products.length})` },
                    { id: 'low', label: `Produtos com estoque baixo (${lowProducts.length})` },
                    { id: 'summary', label: `Resumo das movimentações (${movements.length})` }
                  ].map(t => `
                    <button
                      onclick="App.setReportTab('${t.id}')"
                      class="pb-3.5 text-xs font-semibold border-b-2 transition-colors ${
                        tab === t.id
                          ? 'border-[#18181B] text-[#18181B]'
                          : 'border-transparent text-[#71717A] hover:text-[#18181B]'
                      }"
                    >
                      ${t.label}
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Tab 1: Produtos Cadastrados -->
              ${tab === 'all' ? `
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="bg-[#FAFAFA] border-b border-[#E5E7EB] text-[11px] font-medium text-[#71717A]">
                        <th class="py-3 px-5">SKU</th>
                        <th class="py-3 px-4">Produto</th>
                        <th class="py-3 px-4">Categoria</th>
                        <th class="py-3 px-4 text-right">Qtd. Atual</th>
                        <th class="py-3 px-4 text-right">Valor Unit.</th>
                        <th class="py-3 px-5 text-right">Valor Total</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-[#F4F4F5] text-xs">
                      ${products.map(p => `
                        <tr class="hover:bg-[#FAFAFA]">
                          <td class="py-3 px-5 font-mono text-[11px] text-[#52525B]">${Utils.escapeHtml(p.sku)}</td>
                          <td class="py-3 px-4 font-medium text-[#18181B]">${Utils.escapeHtml(p.name)}</td>
                          <td class="py-3 px-4 text-[#71717A]">${Utils.escapeHtml(p.category)}</td>
                          <td class="py-3 px-4 text-right font-medium text-[#18181B]">${p.quantity} ${p.unit}</td>
                          <td class="py-3 px-4 text-right text-[#52525B]">${Utils.formatCurrency(p.price)}</td>
                          <td class="py-3 px-5 text-right font-semibold text-[#18181B]">${Utils.formatCurrency(p.price * p.quantity)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                    <tfoot>
                      <tr class="bg-[#FAFAFA] border-t border-[#E5E7EB] text-xs font-bold text-[#18181B]">
                        <td colspan="5" class="py-3 px-5 text-right">Total Consolidado em Estoque:</td>
                        <td class="py-3 px-5 text-right">${Utils.formatCurrency(totalStockValue)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              ` : ''}

              <!-- Tab 2: Produtos com Estoque Baixo -->
              ${tab === 'low' ? `
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="bg-[#FAFAFA] border-b border-[#E5E7EB] text-[11px] font-medium text-[#71717A]">
                        <th class="py-3 px-5">SKU</th>
                        <th class="py-3 px-4">Produto</th>
                        <th class="py-3 px-4 text-right">Saldo Atual</th>
                        <th class="py-3 px-4 text-right">Estoque Mínimo</th>
                        <th class="py-3 px-4 text-right">Déficit</th>
                        <th class="py-3 px-5 text-right">Custo Est. Reposição</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-[#F4F4F5] text-xs">
                      ${lowProducts.length === 0 ? `
                        <tr><td colspan="6" class="py-8 text-center text-[#71717A]">Nenhum item abaixo do estoque mínimo.</td></tr>
                      ` : lowProducts.map(p => {
                        const deficit = Math.max(0, p.minStock - p.quantity);
                        return `
                          <tr class="hover:bg-[#FAFAFA]">
                            <td class="py-3 px-5 font-mono text-[11px] text-[#52525B]">${Utils.escapeHtml(p.sku)}</td>
                            <td class="py-3 px-4 font-medium text-[#18181B]">${Utils.escapeHtml(p.name)}</td>
                            <td class="py-3 px-4 text-right font-semibold text-amber-700">${p.quantity} ${p.unit}</td>
                            <td class="py-3 px-4 text-right text-[#52525B]">${p.minStock} ${p.unit}</td>
                            <td class="py-3 px-4 text-right font-semibold text-[#18181B]">${deficit} ${p.unit}</td>
                            <td class="py-3 px-5 text-right font-medium text-[#18181B]">${Utils.formatCurrency(deficit * p.price)}</td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              ` : ''}

              <!-- Tab 3: Resumo das Movimentações -->
              ${tab === 'summary' ? `
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="bg-[#FAFAFA] border-b border-[#E5E7EB] text-[11px] font-medium text-[#71717A]">
                        <th class="py-3 px-5">Data e Hora</th>
                        <th class="py-3 px-4">Referência</th>
                        <th class="py-3 px-4">Produto</th>
                        <th class="py-3 px-4">Operação</th>
                        <th class="py-3 px-4">Responsável</th>
                        <th class="py-3 px-5 text-right">Quantidade</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-[#F4F4F5] text-xs">
                      ${movements.map(m => `
                        <tr class="hover:bg-[#FAFAFA]">
                          <td class="py-3 px-5 text-[#71717A]">${Utils.escapeHtml(m.date)}</td>
                          <td class="py-3 px-4 font-mono text-[11px] text-[#52525B]">${Utils.escapeHtml(m.reference)}</td>
                          <td class="py-3 px-4 font-medium text-[#18181B]">${Utils.escapeHtml(m.productName)}</td>
                          <td class="py-3 px-4">${m.type === 'entrada' ? 'Entrada' : 'Saída'}</td>
                          <td class="py-3 px-4 text-[#52525B]">${Utils.escapeHtml(m.responsible)}</td>
                          <td class="py-3 px-5 text-right font-semibold text-[#18181B]">
                            ${m.type === 'entrada' ? '+' : '−'}${m.quantity} ${m.unit}
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }
    };

    // ============================================================================
    // 5. APPLICATION CONTROLLER
    // ============================================================================
    const App = {
      init() {
        Store.init();
        this.render();
      },

      render() {
        const appRoot = document.getElementById('app');

        if (!Store.state.isAuthenticated) {
          appRoot.innerHTML = Views.LoginView();
          if (window.lucide) lucide.createIcons();
          return;
        }

        let viewHtml = '';
        switch (Store.state.currentRoute) {
          case 'products':
            viewHtml = Views.ProductsView();
            break;
          case 'movements':
            viewHtml = Views.MovementsView();
            break;
          case 'alerts':
            viewHtml = Views.AlertsView();
            break;
          case 'reports':
            viewHtml = Views.ReportsView();
            break;
          case 'dashboard':
          default:
            viewHtml = Views.DashboardView();
            break;
        }

        appRoot.innerHTML = `
          <div class="min-h-screen flex bg-[#FAFAFA]">
            ${Components.renderSidebar()}
            <div class="flex-1 lg:pl-64 flex flex-col min-w-0">
              ${Components.renderHeader()}
              <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1440px] w-full mx-auto">
                ${viewHtml}
              </main>
            </div>
          </div>
        `;

        // Restore focus to global search if user was typing
        if (this._keepSearchFocus) {
          const input = document.getElementById('global-search-input');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
          this._keepSearchFocus = false;
        }

        if (window.lucide) lucide.createIcons();
      },

      // UI Toggles
      toggleMobileMenu(open) {
        Store.state.mobileMenuOpen = open;
        this.render();
      },

      toggleNotifications() {
        Store.state.notificationsOpen = !Store.state.notificationsOpen;
        this.render();
      },

      // Global Search Handlers
      onGlobalSearch(value) {
        Store.state.globalSearch = value;
        this._keepSearchFocus = true;
        this.render();
      },

      handleGlobalSearchSelect(route, filterText) {
        Store.state.globalSearch = '';
        if (route === 'products') {
          Store.state.productFilters.search = filterText;
        } else if (route === 'movements') {
          Store.state.movementFilters.search = filterText;
        }
        Store.navigate(route);
      },

      // Filter Handlers
      updateProductFilter(key, value) {
        Store.state.productFilters[key] = value;
        this.render();
      },

      updateMovementFilter(key, value) {
        Store.state.movementFilters[key] = value;
        this.render();
      },

      setReportTab(tabId) {
        Store.state.reportTab = tabId;
        this.render();
      },

      // Auth Handlers
      fillDemoCredentials() {
        const emailEl = document.getElementById('login-email');
        const passEl = document.getElementById('login-password');
        if (emailEl) emailEl.value = 'admin@smartstock.com.br';
        if (passEl) passEl.value = '123456';
      },

      togglePasswordVisibility() {
        const passEl = document.getElementById('login-password');
        const eyeIcon = document.getElementById('password-eye-icon');
        if (!passEl) return;
        const isPass = passEl.type === 'password';
        passEl.type = isPass ? 'text' : 'password';
        if (eyeIcon) {
          eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
          if (window.lucide) lucide.createIcons();
        }
      },

      handleLoginSubmit(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        const email = String(formData.get('email') || '').trim();
        const password = String(formData.get('password') || '').trim();
        const errorBox = document.getElementById('login-error');

        if (!email || !email.includes('@') || password.length < 4) {
          if (errorBox) {
            errorBox.textContent = 'Por favor, informe um e-mail válido e uma senha com pelo menos 4 caracteres.';
            errorBox.classList.remove('hidden');
          }
          return;
        }

        Store.login(email);
        Components.showToast('Bem-vindo ao SmartStock!');
      },

      // Form Submissions
      handleProductFormSubmit(event, productId) {
        event.preventDefault();
        const formData = new FormData(event.target);
        const payload = {
          name: formData.get('name'),
          sku: formData.get('sku'),
          category: formData.get('category'),
          price: formData.get('price'),
          quantity: formData.get('quantity'),
          minStock: formData.get('minStock'),
          unit: formData.get('unit')
        };

        if (productId) {
          Store.updateProduct(productId, payload);
        } else {
          Store.addProduct(payload);
        }
        Components.closeModal();
      },

      handleMovementFormSubmit(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        const result = Store.registerMovement({
          productId: formData.get('productId'),
          type: formData.get('type'),
          quantity: formData.get('quantity'),
          responsible: formData.get('responsible'),
          reference: formData.get('reference'),
          notes: formData.get('notes')
        });

        if (!result.ok) {
          const errBox = document.getElementById('movement-error-box');
          if (errBox) {
            errBox.textContent = result.error;
            errBox.classList.remove('hidden');
          }
          return;
        }

        Components.closeModal();
      },

      // CSV Exports
      exportDashboardCSV() {
        const headers = ['SKU', 'Produto', 'Categoria', 'Quantidade', 'Unidade', 'Estoque Minimo', 'Preco Unitario', 'Valor Total'];
        const rows = Store.state.products.map(p => [
          p.sku,
          p.name,
          p.category,
          p.quantity,
          p.unit,
          p.minStock,
          p.price.toFixed(2),
          (p.price * p.quantity).toFixed(2)
        ]);
        Utils.downloadCSV('smartstock_inventario_geral.csv', headers, rows);
        Components.showToast('Relatório CSV exportado com sucesso.');
      },

      exportCurrentReportCSV() {
        const tab = Store.state.reportTab;
        if (tab === 'low') {
          const headers = ['SKU', 'Produto', 'Saldo Atual', 'Estoque Minimo', 'Deficit'];
          const rows = Store.getLowStockProducts().map(p => [
            p.sku,
            p.name,
            p.quantity,
            p.minStock,
            Math.max(0, p.minStock - p.quantity)
          ]);
          Utils.downloadCSV('smartstock_estoque_baixo.csv', headers, rows);
        } else if (tab === 'summary') {
          const headers = ['Data', 'Referencia', 'SKU', 'Produto', 'Tipo', 'Quantidade', 'Responsavel'];
          const rows = Store.state.movements.map(m => [
            m.date,
            m.reference,
            m.productSku,
            m.productName,
            m.type,
            m.quantity,
            m.responsible
          ]);
          Utils.downloadCSV('smartstock_movimentacoes.csv', headers, rows);
        } else {
          this.exportDashboardCSV();
          return;
        }
        Components.showToast('Arquivo CSV gerado e baixado.');
      }
    };

    // Bootstrap Application
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
