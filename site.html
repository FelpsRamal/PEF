<body class="bg-[#FAFAFA] text-[#18181B] selection:bg-[#18181B] selection:text-white overflow-x-hidden">

  <!-- Global Modal Container -->

  <!-- Global Toast Container -->
  <div id="toast-root" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <script>
    /**
     * ============================================================================
     * SMARTSTOCK FRONT-END ARCHITECTURE
     * Modular Vanilla JS Application:
     * 1. Utils: Formatters (Currency, Dates, CSV Export)
     * 2. Store: Centralized Reactive State & localStorage Persistence
     * 3. Components: Reusable UI Primitives (Sidebar, Header, KPIs, Modals, Toasts)
     * 4. Views: Login, Dashboard, Products, Movements, Alerts, Reports, Settings
     * 5. Router/App: View Orchestration & Event Delegation
     * ============================================================================
     */

    // ============================================================================
    // 1. UTILS
    // ============================================================================
    const Utils = {
      formatCurrency(value) {
        return new Intl.NumberFormat('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        }).format(Number(value) || 0);
      },

      formatNumber(value) {
        return new Intl.NumberFormat('pt-BR').format(Number(value) || 0);
      },

      generateId(prefix = 'ID') {
        return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.floor(Math.random() * 1000)}`;
      },

      escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },

      formatDateTimeNow() {
        const now = new Date();
        const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        const day = String(now.getDate()).padStart(2, '0');
        const month = months[now.getMonth()];
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        return `${day} ${month}, ${hours}:${minutes}`;
      },

      downloadCSV(filename, headers, rows) {
        const csvContent = [
          headers.join(';'),
          ...rows.map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(';'))
        ].join('\n');

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }
    };

    // ============================================================================

    const SEED_DATA = {

        {

        }
      ],
      weeklyFlow: [
        { day: '11 nov', entradas: 12, saidas: 8 },
        { day: '12 nov', entradas: 18, saidas: 6 },
        { day: '13 nov', entradas: 10, saidas: 12 },
        { day: '14 nov', entradas: 22, saidas: 10 },
        { day: '15 nov', entradas: 8, saidas: 7 },
        { day: '16 nov', entradas: 16, saidas: 12 },
        { day: '17 nov', entradas: 12, saidas: 9 }
      ]
    };

    const Store = {
      STORAGE_KEY: 'smartstock_v1_state',
      state: {
        isAuthenticated: false,
        user: {
          name: 'Administrador',
          role: 'Gestão de estoque',
          email: 'admin@smartstock.com.br'
        },
        currentRoute: 'dashboard', // 'dashboard' | 'products' | 'movements' | 'alerts' | 'reports'
        mobileMenuOpen: false,
        notificationsOpen: false,
        globalSearch: '',
        productFilters: {
          search: '',
          category: 'all',
          status: 'all' // 'all' | 'low' | 'normal'
        },
        movementFilters: {
          search: '',
          type: 'all' // 'all' | 'entrada' | 'saida'
        },
        reportTab: 'all', // 'all' | 'low' | 'summary'
        products: [],
        movements: [],
        weeklyFlow: []
      },

      init() {
        try {
          const saved = localStorage.getItem(this.STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            this.state.isAuthenticated = Boolean(parsed.isAuthenticated);
            this.state.user = parsed.user || this.state.user;
            this.state.products = Array.isArray(parsed.products) ? parsed.products : structuredClone(SEED_DATA.products);
            this.state.movements = Array.isArray(parsed.movements) ? parsed.movements : structuredClone(SEED_DATA.movements);
            this.state.weeklyFlow = Array.isArray(parsed.weeklyFlow) ? parsed.weeklyFlow : structuredClone(SEED_DATA.weeklyFlow);
          } else {
            this.resetToDemo(false);
          }
        } catch (err) {
          console.error('Erro ao carregar localStorage:', err);
          this.resetToDemo(false);
        }
      },

      save() {
        try {
          const payload = {
            isAuthenticated: this.state.isAuthenticated,
            user: this.state.user,
            products: this.state.products,
            movements: this.state.movements,
            weeklyFlow: this.state.weeklyFlow
          };
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          console.error('Erro ao salvar estado:', err);
        }
      },

      resetToDemo(rerender = true) {
        this.state.products = structuredClone(SEED_DATA.products);
        this.state.movements = structuredClone(SEED_DATA.movements);
        this.state.weeklyFlow = structuredClone(SEED_DATA.weeklyFlow);
        this.save();
        if (rerender) {
          Components.showToast('Dados demonstrativos restaurados com sucesso.');
          App.render();
        }
      },

      // Auth Actions
      login(email) {
        this.state.isAuthenticated = true;
        if (email) {
          this.state.user.email = email;
        }
        this.save();
        App.render();
      },

      logout() {
        this.state.isAuthenticated = false;
        this.state.mobileMenuOpen = false;
        this.state.notificationsOpen = false;
        this.save();
        App.render();
      },

      // Navigation
      navigate(route) {
        this.state.currentRoute = route;
        this.state.mobileMenuOpen = false;
        this.state.notificationsOpen = false;
        App.render();
      },

      // Computed Getters
      getLowStockProducts() {
        return this.state.products.filter(p => Number(p.quantity) < Number(p.minStock));
      },

      getTotalStockValue() {
        return this.state.products.reduce((acc, p) => acc + (Number(p.quantity) * Number(p.price)), 0);
      },

      getTotalUnitsInStock() {
        return this.state.products.reduce((acc, p) => acc + Number(p.quantity), 0);
      },

      getCategories() {
        return [...new Set(this.state.products.map(p => p.category))].sort();
      },

      // Product CRUD
      addProduct(productData) {
        const newProduct = {
          id: Utils.generateId('PROD'),
          sku: productData.sku.trim().toUpperCase(),
          name: productData.name.trim(),
          category: productData.category.trim(),
          price: Number(productData.price),
          quantity: Number(productData.quantity),
          minStock: Number(productData.minStock),
          unit: productData.unit.trim() || 'un.'
        };
        this.state.products.unshift(newProduct);
        this.save();
        Components.showToast(`Produto "${newProduct.name}" cadastrado com sucesso.`);
        App.render();
      },

      updateProduct(id, updatedData) {
        const idx = this.state.products.findIndex(p => p.id === id);
        if (idx === -1) return;
        this.state.products[idx] = {
          ...this.state.products[idx],
          sku: updatedData.sku.trim().toUpperCase(),
          name: updatedData.name.trim(),
          category: updatedData.category.trim(),
          price: Number(updatedData.price),
          quantity: Number(updatedData.quantity),
          minStock: Number(updatedData.minStock),
          unit: updatedData.unit.trim() || 'un.'
        };
        this.save();
        Components.showToast(`Produto "${this.state.products[idx].name}" atualizado.`);
        App.render();
      },

      deleteProduct(id) {
        const prod = this.state.products.find(p => p.id === id);
        if (!prod) return;
        this.state.products = this.state.products.filter(p => p.id !== id);
        this.save();
        Components.showToast(`Produto "${prod.name}" removido do catálogo.`);
        App.render();
      },

      // Stock Movement
      registerMovement({ productId, type, quantity, responsible, reference, notes }) {
        const prodIndex = this.state.products.findIndex(p => p.id === productId);
        if (prodIndex === -1) {
          return { ok: false, error: 'Produto selecionado não encontrado.' };
        }

        const prod = this.state.products[prodIndex];
        const qty = Number(quantity);

        if (qty <= 0 || isNaN(qty)) {
          return { ok: false, error: 'Informe uma quantidade válida maior que zero.' };
        }

        if (type === 'saida' && qty > prod.quantity) {
          return {
            ok: false,
            error: `Saldo insuficiente! Disponível em estoque: ${prod.quantity} ${prod.unit}.`
          };
        }

        // Update stock balance
        if (type === 'entrada') {
          prod.quantity = Number(prod.quantity) + qty;
        } else {
          prod.quantity = Number(prod.quantity) - qty;
        }

        // Record movement
        const movement = {
          id: Utils.generateId('MOV'),
          productId: prod.id,
          productName: prod.name,
          productSku: prod.sku,
          type,
          quantity: qty,
          unit: prod.unit,
          responsible: responsible.trim() || this.state.user.name,
          date: Utils.formatDateTimeNow(),
          reference: reference.trim().toUpperCase() || (type === 'entrada' ? `NF-${Math.floor(10000 + Math.random() * 89999)}` : `REQ-${Math.floor(1000 + Math.random() * 8999)}`),
          notes: notes ? notes.trim() : ''
        };

        this.state.movements.unshift(movement);

        // Update last bar of weekly chart to reflect real-time activity
        if (this.state.weeklyFlow.length > 0) {
          const todayBar = this.state.weeklyFlow[this.state.weeklyFlow.length - 1];
          if (type === 'entrada') {
            todayBar.entradas += Math.max(1, Math.round(qty / 5));
          } else {
            todayBar.saidas += Math.max(1, Math.round(qty / 5));
          }
        }

        this.save();
        Components.showToast(
          `${type === 'entrada' ? 'Entrada' : 'Saída'} de ${qty} ${prod.unit} (${prod.sku}) registrada!`
        );
        App.render();
        return { ok: true };
      }
    };

    // ============================================================================
    // 3. REUSABLE UI COMPONENTS
    // ============================================================================
    const Components = {
      renderBrandLogo(size = 'md') {
        const boxClass = size === 'lg' ? 'w-10 h-10 rounded-xl' : 'w-8 h-8 rounded-lg';
        const iconSize = size === 'lg' ? 'w-5 h-5' : 'w-4 h-4';
        const textClass = size === 'lg' ? 'text-xl' : 'text-[17px]';
        return `
          <div class="flex items-center gap-2.5 select-none">
            <div class="${boxClass} bg-[#18181B] text-white flex items-center justify-center shadow-sm shrink-0">
              <i data-lucide="box" class="${iconSize} stroke-[2.2]"></i>
            </div>
            <span class="${textClass} font-bold tracking-tight text-[#18181B]">SmartStock</span>
          </div>
        `;
      },

      renderBadge(text, variant = 'neutral') {
        const styles = {
          neutral: 'bg-[#F4F4F5] text-[#52525B] border-[#E4E4E7]',
          dark: 'bg-[#18181B] text-white border-[#18181B]',
          warning: 'bg-amber-50 text-amber-800 border-amber-200',
          danger: 'bg-red-50 text-red-700 border-red-200',
          success: 'bg-emerald-50 text-emerald-700 border-emerald-200'
        };
        return `
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium border ${styles[variant] || styles.neutral}">
            ${Utils.escapeHtml(text)}
          </span>
        `;
      },

      renderKpiCard({ title, value, icon, subLeft, subRight, highlight = false }) {
        return `
          <div class="bg-white border border-[#E5E7EB] rounded-xl p-5 flex flex-col justify-between transition-all hover:border-[#D4D4D8]">
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-[13px] font-medium text-[#71717A]">${Utils.escapeHtml(title)}</span>
              <div class="text-[#71717A]">
                <i data-lucide="${icon}" class="w-4 h-4 stroke-[1.8]"></i>
              </div>
            </div>
            <div class="text-2xl sm:text-[26px] font-bold tracking-tight text-[#18181B] mb-2.5">
              ${Utils.escapeHtml(value)}
            </div>
            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="${highlight ? 'font-semibold text-[#18181B]' : 'font-medium text-[#52525B]'}">${subLeft}</span>
              <span class="text-[#71717A] truncate">${subRight}</span>
            </div>
          </div>
        `;
      },

      renderSidebar() {
        const lowCount = Store.getLowStockProducts().length;

        const navItems = [
          { id: 'dashboard', label: 'Visão geral', icon: 'layout-grid' },
          { id: 'products', label: 'Produtos', icon: 'package' },
          { id: 'movements', label: 'Movimentações', icon: 'arrow-left-right' },
          { id: 'alerts', label: 'Alertas de estoque', icon: 'bell', badge: lowCount > 0 ? lowCount : null },
          { id: 'reports', label: 'Relatórios', icon: 'bar-chart-2' }
        ];

        const sidebarContent = `
          <div class="flex flex-col h-full bg-white border-r border-[#E5E7EB] w-64 select-none">
            <!-- Brand Header -->
            <div class="h-16 px-5 flex items-center justify-between border-b border-transparent">

              </button>
            </div>

            <!-- Navigation Menu -->
            <div class="flex-1 px-3.5 py-3 overflow-y-auto flex flex-col justify-between gap-6">
              <div>
                <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-[#A1A1AA]">
                  GESTÃO DE ESTOQUE

                <nav class="space-y-1">
                  ${navItems.map(item => {
                    const isActive = route === item.id;
                    return `
                      <button
                        onclick="Store.navigate('${item.id}')"
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-[13px] font-medium transition-colors ${
                          isActive
                            ? 'bg-[#18181B] text-white shadow-xs'
                            : 'text-[#52525B] hover:bg-[#F4F4F5] hover:text-[#18181B]'
                        }"
                      >
                        <span class="flex items-center gap-2.5">
                          <i data-lucide="${item.icon}" class="w-4 h-4 ${isActive ? 'text-white' : 'text-[#71717A]'}"></i>
                          <span>${item.label}</span>
                        </span>
                        ${item.badge !== null && item.badge !== undefined ? `
                          <span class="px-1.5 py-0.5 text-[11px] font-semibold rounded-md ${
                            isActive ? 'bg-white/20 text-white' : 'bg-[#F4F4F5] text-[#18181B] border border-[#E4E4E7]'
                          }">
                            ${item.badge}
                          </span>
                        ` : ''}
                      </button>
                    `;
                  }).join('')}
                </nav>

                <!-- Intelligence Section (Arquitetura N8N Dia 9) -->
                <div class="mt-6">
                  <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-[#A1A1AA]">
                    INTELIGÊNCIA
                  </div>
                  <button
                    onclick="Components.openAiRoadmapModal()"
                    class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-[13px] font-medium text-[#71717A] hover:bg-[#F4F4F5] hover:text-[#18181B] transition-colors"
                  >
                    <span class="flex items-center gap-2.5">
                      <i data-lucide="sparkles" class="w-4 h-4 text-[#71717A]"></i>
                      <span>Assistente IA</span>
                    </span>
                    <span class="px-1.5 py-0.5 text-[10px] font-medium rounded-md bg-[#F4F4F5] text-[#71717A] border border-[#E4E4E7]">
                      Em breve
                    </span>
                  </button>
                </div>
              </div>

              <!-- Future Integration Card (Matches image_5086ad.png bottom left) -->
              <div class="bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl p-3.5">
                <div class="w-7 h-7 rounded-lg bg-white border border-[#E5E7EB] flex items-center justify-center mb-2.5 text-[#18181B]">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                </div>
                <h4 class="text-xs font-semibold text-[#18181B] mb-1">Seu estoque, mais inteligente</h4>
                <p class="text-[11px] leading-relaxed text-[#71717A] mb-2.5">
                  Consultas em linguagem natural e automações com IA via N8N.
                </p>
                <button onclick="Components.openAiRoadmapModal()" class="text-[11px] font-medium text-[#52525B] hover:text-[#18181B] flex items-center gap-1">
                  <span>Integração futura</span>
                  <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
                </button>
              </div>
            </div>

            <!-- Sidebar Footer -->
            <div class="p-3.5 border-t border-[#E5E7EB] space-y-1">
              <button
                onclick="Components.openSettingsModal()"
                class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-[#52525B] hover:bg-[#F4F4F5] hover:text-[#18181B] transition-colors"
              >
                <i data-lucide="settings" class="w-4 h-4 text-[#71717A]"></i>
                <span>Configurações</span>
              </button>
              <button
                onclick="Store.logout()"
                class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-[#52525B] hover:bg-red-50 hover:text-red-700 transition-colors"
              >
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>Sair da conta</span>
              </button>
              <div class="px-3 pt-2 text-[10px] text-[#A1A1AA]">
                SmartStock &nbsp;/&nbsp; Plataforma web
              </div>
            </div>
          </div>
        `;

        return `
          <!-- Desktop Fixed Sidebar -->
          <aside class="hidden lg:block fixed inset-y-0 left-0 z-30 w-64 no-print">
            ${sidebarContent}
          </aside>

          <!-- Mobile Drawer Overlay -->
          ${Store.state.mobileMenuOpen ? `
            <div class="lg:hidden fixed inset-0 z-40 flex no-print">
              <div onclick="App.toggleMobileMenu(false)" class="fixed inset-0 bg-black/40 backdrop-blur-[1px]"></div>
              <div class="relative z-50 w-64 max-w-[80vw] h-full">
                ${sidebarContent}
              </div>
            </div>
          ` : ''}
        `;
      },

      renderHeader() {
        const routeNames = {
          dashboard: 'Operação principal',
          products: 'Gestão de produtos',
          movements: 'Movimentação de estoque',
          alerts: 'Alertas de reposição',
          reports: 'Relatórios gerenciais'
        };

        const lowStockItems = Store.getLowStockProducts();
        const searchVal = Store.state.globalSearch;

        // Global search quick results
        let searchResultsHtml = '';
        if (searchVal.trim().length > 0) {
          const q = searchVal.toLowerCase();
          const matchedProducts = Store.state.products.filter(
            p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
          ).slice(0, 4);

          const matchedMovements = Store.state.movements.filter(
            m => m.productName.toLowerCase().includes(q) || m.reference.toLowerCase().includes(q) || m.responsible.toLowerCase().includes(q)
          ).slice(0, 3);

          searchResultsHtml = `
            <div class="absolute left-0 right-0 top-full mt-1.5 bg-white border border-[#E5E7EB] rounded-xl shadow-lg z-40 overflow-hidden">
              ${matchedProducts.length === 0 && matchedMovements.length === 0 ? `
                <div class="p-4 text-xs text-[#71717A] text-center">Nenhum resultado para "${Utils.escapeHtml(searchVal)}"</div>
              ` : `
                ${matchedProducts.length > 0 ? `
                  <div class="px-3 py-1.5 bg-[#FAFAFA] border-b border-[#E5E7EB] text-[10px] font-semibold uppercase text-[#71717A]">
                    Produtos (${matchedProducts.length})
                  </div>
                  ${matchedProducts.map(p => `
                    <button
                      onclick="App.handleGlobalSearchSelect('products', '${Utils.escapeHtml(p.sku)}')"
                      class="w-full px-3.5 py-2.5 text-left hover:bg-[#F4F4F5] flex items-center justify-between border-b border-[#F4F4F5] last:border-0"
                    >
                      <div>
                        <div class="text-xs font-medium text-[#18181B]">${Utils.escapeHtml(p.name)}</div>
                        <div class="text-[11px] text-[#71717A]">${Utils.escapeHtml(p.sku)} • ${Utils.escapeHtml(p.category)}</div>
                      </div>
                      <span class="text-xs font-semibold ${p.quantity < p.minStock ? 'text-amber-700' : 'text-[#18181B]'}">
                        ${p.quantity} ${p.unit}
                      </span>
                    </button>
                  `).join('')}
                ` : ''}
                ${matchedMovements.length > 0 ? `
                  <div class="px-3 py-1.5 bg-[#FAFAFA] border-y border-[#E5E7EB] text-[10px] font-semibold uppercase text-[#71717A]">
                    Movimentações (${matchedMovements.length})
                  </div>
                  ${matchedMovements.map(m => `
                    <button
                      onclick="App.handleGlobalSearchSelect('movements', '${Utils.escapeHtml(m.reference)}')"
                      class="w-full px-3.5 py-2.5 text-left hover:bg-[#F4F4F5] flex items-center justify-between border-b border-[#F4F4F5] last:border-0"
                    >
                      <div>
                        <div class="text-xs font-medium text-[#18181B]">${Utils.escapeHtml(m.productName)} (${Utils.escapeHtml(m.reference)})</div>
                        <div class="text-[11px] text-[#71717A]">${Utils.escapeHtml(m.responsible)} • ${Utils.escapeHtml(m.date)}</div>
                      </div>
                      <span class="text-xs font-semibold text-[#18181B]">
                        ${m.type === 'entrada' ? '+' : '-'}${m.quantity} ${m.unit}
                      </span>
                    </button>
                  `).join('')}
                ` : ''}
              `}
            </div>
          `;
        }

        return `
          <header class="sticky top-0 z-20 h-16 bg-white/95 backdrop-blur-xs border-b border-[#E5E7EB] px-4 sm:px-8 flex items-center justify-between gap-4 no-print">
            <!-- Left: Mobile Toggle + Breadcrumb -->
            <div class="flex items-center gap-3 min-w-0">
              <button
                onclick="App.toggleMobileMenu(true)"
                class="lg:hidden p-2 -ml-2 rounded-lg text-[#52525B] hover:bg-[#F4F4F5]"
                aria-label="Abrir menu"
              >
                <i data-lucide="menu" class="w-5 h-5"></i>
              </button>
              <nav class="flex items-center gap-2 text-xs sm:text-[13px] truncate">
                <span class="text-[#71717A] hidden sm:inline">Workspace</span>
                <span class="text-[#D4D4D8] hidden sm:inline">/</span>
                <span class="font-medium text-[#18181B] truncate">${routeNames[Store.state.currentRoute] || 'Operação principal'}</span>
              </nav>
            </div>

            <!-- Right: Global Search + Notifications + User -->
            <div class="flex items-center gap-3 sm:gap-5">
              <!-- Search Input -->
              <div class="relative w-44 sm:w-64 md:w-72">
                <i data-lucide="search" class="w-3.5 h-3.5 text-[#A1A1AA] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <input
                  id="global-search-input"
                  type="text"
                  value="${Utils.escapeHtml(searchVal)}"
                  oninput="App.onGlobalSearch(this.value)"
                  placeholder="Buscar produtos ou movimentações"
                  class="w-full h-9 pl-8.5 pr-7 text-xs bg-[#FAFAFA] border border-[#E5E7EB] rounded-lg text-[#18181B] placeholder-[#A1A1AA] focus:outline-none focus:bg-white focus:border-[#18181B] transition-colors"
                />
                ${searchVal ? `
                  <button
                    onclick="App.onGlobalSearch('')"
                    class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#A1A1AA] hover:text-[#18181B]"
                  >
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                ` : ''}
                ${searchResultsHtml}
              </div>

              <!-- Notification Bell -->
              <div class="relative">
                <button
                  onclick="App.toggleNotifications()"
                  class="relative p-2 rounded-lg text-[#52525B] hover:bg-[#F4F4F5] hover:text-[#18181B] transition-colors"
                  aria-label="Notificações"
                >
                  <i data-lucide="bell" class="w-4 h-4"></i>
                  ${lowStockItems.length > 0 ? `
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-[#18181B] ring-2 ring-white"></span>
                  ` : ''}
                </button>

                ${Store.state.notificationsOpen ? `
                  <div class="absolute right-0 mt-2 w-80 bg-white border border-[#E5E7EB] rounded-xl shadow-lg z-40 overflow-hidden">
                    <div class="px-4 py-3 border-b border-[#E5E7EB] flex items-center justify-between">
                      <span class="text-xs font-semibold text-[#18181B]">Alertas de Estoque</span>
                      <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-[#F4F4F5] text-[#18181B]">
                        ${lowStockItems.length} itens
                      </span>
                    </div>
                    <div class="max-h-64 overflow-y-auto divide-y divide-[#F4F4F5]">
                      ${lowStockItems.length === 0 ? `
                        <div class="p-4 text-xs text-[#71717A] text-center">Todos os itens estão com estoque regular.</div>
                      ` : lowStockItems.slice(0, 5).map(item => `
                        <div class="px-4 py-3 hover:bg-[#FAFAFA] flex items-center justify-between gap-2">
                          <div class="min-w-0">
                            <p class="text-xs font-medium text-[#18181B] truncate">${Utils.escapeHtml(item.name)}</p>
                            <p class="text-[11px] text-[#71717A]">${Utils.escapeHtml(item.sku)} • Mínimo: ${item.minStock} ${item.unit}</p>
                          </div>
                          <button
                            onclick="Components.openMovementModal('${item.id}', 'entrada', ${Math.max(10, item.minStock * 2 - item.quantity)})"
                            class="shrink-0 px-2.5 py-1 text-[11px] font-medium bg-[#18181B] text-white rounded-md hover:bg-[#27272A]"
                          >
                            Repor (${item.quantity} ${item.unit})
                          </button>
                        </div>
                      `).join('')}
                    </div>
                    <div class="px-4 py-2.5 bg-[#FAFAFA] border-t border-[#E5E7EB] text-center">
                      <button onclick="Store.navigate('alerts')" class="text-xs font-medium text-[#18181B] hover:underline">
                        Ver central de alertas →
                      </button>
                    </div>
                  </div>
                ` : ''}
              </div>

              <!-- User Profile -->
              <div class="flex items-center gap-2.5 pl-2 border-l border-[#E5E7EB]">
                <div class="w-8 h-8 rounded-full bg-[#F4F4F5] border border-[#E4E4E7] flex items-center justify-center text-xs font-semibold text-[#18181B]">
                  AD
                </div>
                <div class="hidden md:block text-left leading-tight">
                  <div class="text-xs font-semibold text-[#18181B]">${Utils.escapeHtml(Store.state.user.name)}</div>
                  <div class="text-[11px] text-[#71717A]">${Utils.escapeHtml(Store.state.user.role)}</div>
                </div>
              </div>
            </div>
          </header>
        `;
      },

      // Modal System
      openModal(htmlContent) {
        const modalRoot = document.getElementById('modal-root');
        modalRoot.innerHTML = `
          <div class="bg-white border border-[#E5E7EB] rounded-2xl shadow-xl w-full max-w-lg overflow-hidden fade-in" onclick="event.stopPropagation()">
            ${htmlContent}
          </div>
        `;
        modalRoot.classList.remove('hidden');
        modalRoot.classList.add('flex');
        modalRoot.onclick = () => this.closeModal();
        if (window.lucide) lucide.createIcons();
      },

      closeModal() {
        const modalRoot = document.getElementById('modal-root');
        modalRoot.classList.add('hidden');
        modalRoot.classList.remove('flex');
        modalRoot.innerHTML = '';
      },

      // Product Create/Edit Modal
      openProductModal(productId = null) {
        const product = productId ? Store.state.products.find(p => p.id === productId) : null;
        const isEdit = Boolean(product);
        const existingCategories = Store.getCategories();

        this.openModal(`
          <div class="px-6 py-4 border-b border-[#E5E7EB] flex items-center justify-between">
            <div>
              <h3 class="text-base font-semibold text-[#18181B]">${isEdit ? 'Editar Produto' : 'Novo Produto'}</h3>
              <p class="text-xs text-[#71717A]">${isEdit ? 'Atualize as informações cadastrais e parâmetros de estoque.' : 'Cadastre um novo item no catálogo do SmartStock.'}</p>
            </div>
            <button onclick="Components.closeModal()" class="p-1.5 rounded-lg text-[#71717A] hover:bg-[#F4F4F5]">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <form onsubmit="App.handleProductFormSubmit(event, '${productId || ''}')" class="p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-[#18181B] mb-1">Nome do produto *</label>
                <input
                  type="text"
                  name="name"
                  required
                  value="${isEdit ? Utils.escapeHtml(product.name) : ''}"
                  placeholder="Ex: Luvas de proteção nitrílica"
                  class="w-full h-9 px-3 text-xs border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Código / SKU *</label>
                <input
                  type="text"
                  name="sku"
                  required
                  value="${isEdit ? Utils.escapeHtml(product.sku) : ''}"
                  placeholder="Ex: LUV-002"
                  class="w-full h-9 px-3 text-xs uppercase border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Categoria *</label>
                <input
                  type="text"
                  name="category"
                  list="categories-list"
                  required
                  value="${isEdit ? Utils.escapeHtml(product.category) : ''}"
                  placeholder="Selecione ou digite..."
                  class="w-full h-9 px-3 text-xs border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
                <datalist id="categories-list">
                  ${existingCategories.map(cat => `<option value="${Utils.escapeHtml(cat)}">`).join('')}
                </datalist>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Preço Unitário (R$) *</label>
                <input
                  type="number"
                  name="price"
                  step="0.01"
                  min="0"
                  required
                  value="${isEdit ? product.price : ''}"
                  placeholder="0,00"
                  class="w-full h-9 px-3 text-xs border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
              </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">${isEdit ? 'Qtd. Atual *' : 'Qtd. Inicial *'}</label>
                <input
                  type="number"
                  name="quantity"
                  min="0"
                  required
                  value="${isEdit ? product.quantity : 0}"
                  class="w-full h-9 px-3 text-xs border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Estoque Mínimo *</label>
                <input
                  type="number"
                  name="minStock"
                  min="1"
                  required
                  value="${isEdit ? product.minStock : 10}"
                  class="w-full h-9 px-3 text-xs border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Unidade</label>
                <select
                  name="unit"
                  class="w-full h-9 px-3 text-xs bg-white border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                >
                  ${['un.', 'cx.', 'pct.', 'lt.', 'kg.', 'par'].map(u => `
                    <option value="${u}" ${isEdit && product.unit === u ? 'selected' : ''}>${u}</option>
                  `).join('')}
                </select>
              </div>
            </div>

            <div class="pt-3 border-t border-[#E5E7EB] flex items-center justify-end gap-2.5">
              <button
                type="button"
                onclick="Components.closeModal()"
                class="px-4 py-2 text-xs font-medium text-[#52525B] bg-white border border-[#E5E7EB] rounded-lg hover:bg-[#F4F4F5]"
              >
                Cancelar
              </button>
              <button
                type="submit"
                class="px-4 py-2 text-xs font-medium text-white bg-[#18181B] rounded-lg hover:bg-[#27272A]"
              >
                ${isEdit ? 'Salvar alterações' : 'Cadastrar produto'}
              </button>
            </div>
          </form>
        `);
      },

      // Delete Confirmation Modal
      openDeleteConfirmModal(productId) {
        const product = Store.state.products.find(p => p.id === productId);
        if (!product) return;

        this.openModal(`
          <div class="p-6">
            <div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center mb-4">
              <i data-lucide="trash-2" class="w-5 h-5"></i>
            </div>
            <h3 class="text-base font-semibold text-[#18181B] mb-1">Excluir produto do catálogo?</h3>
            <p class="text-xs text-[#71717A] leading-relaxed mb-5">
              Você está prestes a remover <strong class="text-[#18181B]">${Utils.escapeHtml(product.name)} (${Utils.escapeHtml(product.sku)})</strong>. Esta ação não poderá ser desfeita.
            </p>
            <div class="flex items-center justify-end gap-2.5">
              <button
                onclick="Components.closeModal()"
                class="px-4 py-2 text-xs font-medium text-[#52525B] bg-white border border-[#E5E7EB] rounded-lg hover:bg-[#F4F4F5]"
              >
                Cancelar
              </button>
              <button
                onclick="Store.deleteProduct('${product.id}'); Components.closeModal();"
                class="px-4 py-2 text-xs font-medium text-white bg-red-600 rounded-lg hover:bg-red-700"
              >
                Sim, excluir produto
              </button>
            </div>
          </div>
        `);
      },

      // Movement Modal (Entrada / Saída)
      openMovementModal(preselectedProductId = '', preselectedType = 'entrada', preselectedQty = '') {
        Store.state.notificationsOpen = false;
        const products = Store.state.products;

        this.openModal(`
          <div class="px-6 py-4 border-b border-[#E5E7EB] flex items-center justify-between">
            <div>
              <h3 class="text-base font-semibold text-[#18181B]">Nova Movimentação de Estoque</h3>
              <p class="text-xs text-[#71717A]">Registre entradas de fornecedores ou saídas por requisição.</p>
            </div>
            <button onclick="Components.closeModal()" class="p-1.5 rounded-lg text-[#71717A] hover:bg-[#F4F4F5]">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <form onsubmit="App.handleMovementFormSubmit(event)" class="p-6 space-y-4">
            <div id="movement-error-box" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700"></div>

            <!-- Type Selector -->
            <div>
              <label class="block text-xs font-medium text-[#18181B] mb-1.5">Tipo de operação *</label>
              <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer">
                  <input type="radio" name="type" value="entrada" class="peer sr-only" ${preselectedType === 'entrada' ? 'checked' : ''} />
                  <div class="p-3 rounded-xl border border-[#E5E7EB] peer-checked:border-[#18181B] peer-checked:bg-[#FAFAFA] flex items-center gap-2.5 transition-all">
                    <div class="w-7 h-7 rounded-lg bg-[#F4F4F5] flex items-center justify-center text-[#18181B]">
                      <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
                    </div>
                    <div>
                      <div class="text-xs font-semibold text-[#18181B]">Entrada</div>
                      <div class="text-[11px] text-[#71717A]">Reposição / Compra</div>
                    </div>
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="type" value="saida" class="peer sr-only" ${preselectedType === 'saida' ? 'checked' : ''} />
                  <div class="p-3 rounded-xl border border-[#E5E7EB] peer-checked:border-[#18181B] peer-checked:bg-[#FAFAFA] flex items-center gap-2.5 transition-all">
                    <div class="w-7 h-7 rounded-lg bg-[#F4F4F5] flex items-center justify-center text-[#18181B]">
                      <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                      <div class="text-xs font-semibold text-[#18181B]">Saída</div>
                      <div class="text-[11px] text-[#71717A]">Consumo / Requisição</div>
                    </div>
                  </div>
                </label>
              </div>
            </div>

            <!-- Product Select -->
            <div>
              <label class="block text-xs font-medium text-[#18181B] mb-1">Produto *</label>
              <select
                name="productId"
                required
                class="w-full h-9 px-3 text-xs bg-white border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
              >
                <option value="">Selecione um produto...</option>
                ${products.map(p => `
                  <option value="${p.id}" ${p.id === preselectedProductId ? 'selected' : ''}>
                    [${Utils.escapeHtml(p.sku)}] ${Utils.escapeHtml(p.name)} — Saldo atual: ${p.quantity} ${p.unit}
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Quantidade *</label>
                <input
                  type="number"
                  name="quantity"
                  min="1"
                  required
                  value="${preselectedQty}"
                  placeholder="Ex: 25"
                  class="w-full h-9 px-3 text-xs border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#18181B]"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#18181B] mb-1">Documento / Referência</label>
                <input

      // Toast Notification
      showToast(message) {
        const toastRoot = document.getElementById('toast-root');
        const id = 'toast-' + Date.now();
        const el = document.createElement('div');
        el.id = id;
        el.className = 'pointer-events-auto bg-[#18181B] text-white px-4 py-3 rounded-xl shadow-lg border border-[#27272A] flex items-center justify-between gap-3 text-xs font-medium fade-in';
        el.innerHTML = `
          <div class="flex items-center gap-2.5">
            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
            <span>${Utils.escapeHtml(message)}</span>
          </div>
          <button onclick="document.getElementById('${id}')?.remove()" class="text-[#A1A1AA] hover:text-white">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        `;
        toastRoot.appendChild(el);
        if (window.lucide) lucide.createIcons();

        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 250);
        }, 3500);
      }
    };
